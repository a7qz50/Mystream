<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة البث المباشر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Video.js لتشغيل البث المباشر بسلاسة -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- الهيدر الخاص بالبث -->
        <div class="p-4 md:px-6 bg-gray-900/50 border-b border-gray-800 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
                <h1 class="font-bold text-lg text-white">البث المباشر الآن</h1>
            </div>
            <span class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full font-medium">مباشر (LIVE)</span>
        </div>

        <!-- حاوية مشغل الفيديو -->
        <div class="relative w-full aspect-video bg-black flex items-center justify-center">
            <video
                id="livePlayer"
                class="video-js vjs-big-play-centered vjs-fluid w-full h-full"
                controls
                preload="auto"
                data-setup='{}'>
                <!-- ضع رابط الـ HLS الخاص بسيرفر البث هنا (.m3u8) -->
                <source src="http://YOUR_SERVER_IP:8000/live/YOUR_STREAM_KEY/index.m3u8" type="application/x-mpegURL" />
                <p class="vjs-no-js">
                    يرجى تفعيل JavaScript لمتصفحك لمشاهدة البث المباشر.
                </p>
            </video>
        </div>

        <!-- معلومات إضافية تحت الفيديو -->
        <div class="p-6">
            <h2 class="text-xl font-bold text-white mb-2">عنوان البث التجريبي على Vercel</h2>
            <p class="text-gray-400 text-sm">شكراً لمتابعتك! يتم بث هذا المحتوى عبر خادم RTMP الخارجي وعرضه هنا عبر مشغل متوافق مع المتصفح.</p>
        </div>

    </div>

    <!-- مكتبة تشغيل الـ HLS -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

</body>
</html>
