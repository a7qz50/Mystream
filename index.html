<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء بث مباشر - RTMP</title>
    <!-- تضمين Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- عنوان الصفحة -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-red-600/10 text-red-500 rounded-full mb-4 text-2xl">
                <i class="fa-solid fa-tower-broadcast animate-pulse"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">إعدادات البث المباشر</h1>
            <p class="text-gray-400 text-sm mt-1">البيانات مخصصة تلقائياً لدومين موقعك الحالي</p>
        </div>

        <!-- نموذج معلومات البث -->
        <div class="space-y-6">
            
            <!-- حقل رابط خادم RTMP -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-server ml-1 text-indigo-400"></i> خادم الـ RTMP (Server URL)
                </label>
                <div class="flex">
                    <input type="text" id="rtmpUrl" readonly 
                        class="w-full bg-gray-950 border border-gray-700 rounded-r-xl px-4 py-3 text-gray-300 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="copyToClipboard('rtmpUrl', 'urlBtn')" id="urlBtn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-l-xl transition flex items-center justify-center font-medium text-sm">
                        <i class="fa-regular fa-copy ml-1"></i> نسخ
                    </button>
                </div>
            </div>

            <!-- حقل مفتاح البث -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-key ml-1 text-yellow-400"></i> مفتاح البث (Stream Key)
                </label>
                <div class="flex">
                    <input type="password" id="streamKey" readonly 
                        value="live_sec_9384759283" 
                        class="w-full bg-gray-950 border border-gray-700 rounded-r-xl px-4 py-3 text-gray-300 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="copyToClipboard('streamKey', 'keyBtn')" id="keyBtn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-l-xl transition flex items-center justify-center font-medium text-sm">
                        <i class="fa-regular fa-copy ml-1"></i> نسخ
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">تنبيه: لا تشارك مفتاح البث مع أي شخص حفاظاً على قناتك.</p>
            </div>

            <hr class="border-gray-800 my-4">

            <!-- زر النسخ السريع لرابط المشاهدة -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    <i class="fa-solid fa-link ml-1 text-green-400"></i> رابط صفحة المشاهدة
                </label>
                <div class="flex">
                    <input type="text" id="fullStreamLink" readonly 
                        class="w-full bg-gray-950 border border-gray-700 rounded-r-xl px-4 py-3 text-gray-300 text-sm focus:outline-none focus:border-green-500">
                    <button onclick="copyToClipboard('fullStreamLink', 'fullBtn')" id="fullBtn"
                        class="bg-green-600 hover:bg-green-700 text-white px-5 rounded-l-xl transition flex items-center justify-center font-medium text-sm">
                        <i class="fa-regular fa-copy ml-1"></i> نسخ الرابط
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- سكربت جلب الدومين تلقائياً وبرمجة أزرار النسخ -->
    <script>
        // جلب اسم النطاق الحالي الذي يعمل عليه الموقع (Domain)
        const currentHost = window.location.host; 

        // وضع النطاق تلقائياً في الحقول بناءً على رابط الموقع الفعلي
        document.getElementById('rtmpUrl').value = `rtmp://${currentHost}/live`;
        document.getElementById('fullStreamLink').value = `https://${currentHost}/watch`;

        function copyToClipboard(elementId, buttonId) {
            const inputElement = document.getElementById(elementId);
            const isPassword = inputElement.type === 'password';
            if (isPassword) inputElement.type = 'text';
            
            inputElement.select();
            inputElement.setSelectionRange(0, 99999);
            
            navigator.clipboard.writeText(inputElement.value).then(() => {
                if (isPassword) inputElement.type = 'password';
                
                const btn = document.getElementById(buttonId);
                const originalHTML = btn.innerHTML;
                
                btn.innerHTML = '<i class="fa-solid fa-check ml-1"></i> تم النسخ!';
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-emerald-600');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-emerald-600');
                    if(buttonId === 'fullBtn') {
                        btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    } else {
                        btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    }
                }, 2000);
            });
        }
    </script>

</body>
</html>
