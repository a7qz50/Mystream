<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل الفيديو إلى M3U8</title>
    <!-- استيراد Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">تحويل الفيديو إلى M3U8</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">ارفع ملف الفيديو الخاص بك للحصول على رابط البث المباشر.</p>

        <!-- نموذج الرفع -->
        <form id="uploadForm" class="space-y-6">
            <div class="border-2 border-dashed border-gray-600 rounded-xl p-6 text-center hover:border-indigo-500 transition cursor-pointer" onclick="document.getElementById('videoFile').click()">
                <input type="file" id="videoFile" name="video" accept="video/*" class="hidden" required>
                <div id="fileLabel" class="text-gray-300">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    اختر ملف فيديو أو اسحبه هنا
                </div>
            </div>

            <!-- عداد الرفع (Progress Bar) -->
            <div id="progressContainer" class="hidden space-y-2">
                <div class="flex justify-between text-sm text-gray-300">
                    <span id="progressText">جاري الرفع...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-500 h-3 w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-200 cursor-pointer">
                رفع ومعالجة الفيديو
            </button>
        </form>

        <!-- النتيجة (رابط الـ M3U8) -->
        <div id="resultContainer" class="hidden mt-6 p-4 bg-gray-900 rounded-xl border border-gray-700">
            <h3 class="text-sm font-semibold text-green-400 mb-2">تم بنجاح! رابط M3U8 الخاص بك:</h3>
            <div class="flex items-center gap-2">
                <input type="text" id="m3u8Link" readonly class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-gray-300 select-all" />
                <button onclick="copyLink()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 text-sm rounded transition">نسخ</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('videoFile');
        const fileLabel = document.getElementById('fileLabel');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const m3u8Link = document.getElementById('m3u8Link');

        // تحديث اسم الملف عند الاختيار
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = `الملف المختار: ${fileInput.files[0].name}`;
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('video', file);

            // إظهار العداد وإخفاء الزر
            progressContainer.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // محاكاة الرفع باستخدام XMLHttpRequest لمتابعة النسبة المئوية (Progress)
            const xhr = new XMLHttpRequest();
            
            // استبدل '/api/upload' برابط الـ Backend الفعلي الخاص بك
            xhr.open('POST', '/api/upload', true);

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercent.textContent = percent + '%';
                    
                    if (percent === 100) {
                        progressText.textContent = 'جاري المعالجة والتحويل إلى M3U8...';
                    }
                }
            });

            xhr.onload = function () {
                if (xhr.status === 200) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        // افتراض أن الـ Backend يرجع رابط الـ m3u8 هكذا: response.url
                        m3u8Link.value = response.url || "https://example.com/stream/playlist.m3u8";
                        resultContainer.classList.remove('hidden');
                    } catch (err) {
                        alert('حدث خطأ في قراءة الرد من الخادم.');
                    }
                } else {
                    alert('فشل الرفع أو المعالجة.');
                }
                // استعادة الزر
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                progressContainer.classList.add('hidden');
            };

            xhr.onerror = function () {
                alert('حدث خطأ أثناء الاتصال بالخادم.');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                progressContainer.classList.add('hidden');
            };

            xhr.send(formData);
        });

        function copyLink() {
            m3u8Link.select();
            document.execCommand('copy');
            alert('تم نسخ الرابط بنجاح!');
        }
    </script>
</body>
  </html>
